apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-pipeline-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-pipeline-demo
  template:
    metadata:
      labels:
        app: devops-pipeline-demo
    spec:
      containers:
        - name: web
          image: devops-pipeline-demo:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: devops-pipeline-service
spec:
  type: NodePort
  selector:
    app: devops-pipeline-demo
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080